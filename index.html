
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dia8Dragon Mobile</title>
    <meta name="theme-color" content="#07122d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dia8Dragon" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/app-local.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
   
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            transition: background-color 0.3s ease, color 0.3s ease;
            background: #05070a;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        button, [role="button"], .safe-text {
            min-width: 0;
            max-width: 100%;
            letter-spacing: 0 !important;
            overflow-wrap: anywhere;
        }

        button {
            white-space: nowrap;
        }

        button > span:not(.material-symbols-outlined) {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .material-symbols-outlined {
            flex-shrink: 0;
            font-family: "Material Symbols Outlined", "Segoe UI Symbol", "Arial Unicode MS", Arial, sans-serif;
            width: 1.25em;
            height: 1.25em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
            font-weight: 800;
            line-height: 1;
            speak: none;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined::before { content: none !important; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        [class*="tracking-"] {
            letter-spacing: 0 !important;
        }
        
        /* Hiệu ứng nền */
        @keyframes ken-burns {
            0% { transform: scale(0.96); opacity: 0.8; }
            50% { transform: scale(1.04); opacity: 1; }
            100% { transform: scale(0.96); opacity: 0.8; }
        }

        .dragon-bg-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background: #05070a;
        }

        .dragon-bg-image {
            position: absolute;
            inset: 0;
            background-image: url('/assets/dragon-original.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            animation: ken-burns 40s ease-in-out infinite;
            filter: brightness(0.6) saturate(1.2) contrast(1.15);
            will-change: transform;
        }

        .dragon-bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(5, 7, 10, 0.4) 70%, #05070a 100%);
            z-index: 1;
        }

        /* MATRIX AUDIT SCAN EFFECT */
        @keyframes scanline-sweep {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .matrix-scanline {
            position: absolute;
            left: 0; right: 0;
            height: 4px;
            background: linear-gradient(to right, transparent, var(--scan-color, #0d33f2), transparent);
            box-shadow: 0 0 20px 2px var(--scan-color, #0d33f2);
            z-index: 50;
            pointer-events: none;
            animation: scanline-sweep 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* DYNAMIC LIGHTING DIM */
        @keyframes bg-dim-overlay {
            from { opacity: 0; }
            to { opacity: 0.7; }
        }
        .bg-dim-active {
            animation: bg-dim-overlay 0.5s ease-out forwards;
        }

        /* CRYPTO BUBBLE STYLING - HYPER NEON */
        .neon-ring {
            box-shadow: 0 0 25px -5px var(--neon-color),
                        inset 0 0 15px var(--neon-color),
                        0 0 50px -10px var(--neon-color);
            border: 2px solid rgba(255,255,255,0.3);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: box-shadow, transform, filter;
        }

        /* Independent halo keeps the original neon visible even when bubble opacity is lowered. */
        .bubble-container { isolation: isolate; }
        .bubble-neon-halo {
            z-index: 0;
            border: 1px solid rgba(255,255,255,.24);
            border-color: color-mix(in srgb, var(--neon-color) 72%, white 28%);
            box-shadow: 0 0 22px 1px var(--neon-color),
                        0 0 48px -5px var(--neon-color),
                        0 0 82px -22px var(--neon-color);
            opacity: 0.92;
            filter: saturate(1.22);
            transition: box-shadow .6s cubic-bezier(.16,1,.3,1), opacity .4s ease, transform .6s cubic-bezier(.16,1,.3,1);
            will-change: box-shadow, opacity, transform;
        }
        .bubble-container:hover .bubble-neon-halo {
            opacity: 1;
            transform: scale(1.08);
            box-shadow: 0 0 38px 5px var(--neon-color),
                        0 0 78px 0 var(--neon-color),
                        0 0 128px -18px var(--neon-color);
        }
        .bubble-theme-original .bubble-neon-halo {
            border-color: rgba(255,255,255,.26);
        }

        .bubble-container:hover .neon-ring {
            box-shadow: 0 0 60px var(--neon-color), 
                        inset 0 0 30px var(--neon-color),
                        0 0 100px var(--neon-color);
            transform: scale(1.12);
            z-index: 100;
            filter: brightness(1.4) contrast(1.1);
        }

        .bubble-inner {
            background:
                radial-gradient(circle at 30% 30%, var(--shell-tint, rgba(255,255,255,0.4)) 0%, transparent 20%),
                radial-gradient(circle at 70% 70%, rgba(0,0,0,0.4) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, var(--core-color) 0%, var(--core-color-2, rgba(0, 0, 0, 0.95)) 100%);
            border-radius: 50%;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);
            will-change: transform, opacity;
            contain: content;
        }

        .bubble-inner::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 20%;
            width: 35%;
            height: 20%;
            background: linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 100%);
            border-radius: 50%;
            filter: blur(4px);
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 5;
        }

        @keyframes shimmer-sweep {
            0% { transform: translate3d(-150%, -150%, 0) rotate(45deg); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translate3d(150%, 150%, 0) rotate(45deg); opacity: 0; }
        }
        .bubble-shimmer {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(90deg, transparent, var(--shimmer-color, rgba(255,255,255,0.4)), transparent);
            animation: shimmer-sweep 8s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 4;
            will-change: transform, opacity;
        }

        @keyframes breathing {
            0%, 100% {
                transform: scale(1.0);
                filter: brightness(1) saturate(1);
                box-shadow: 0 0 25px -5px var(--neon-color),
                            inset 0 0 15px var(--neon-color),
                            0 0 50px -10px var(--neon-color);
            }
            50% {
                transform: scale(1.04);
                filter: brightness(1.2) saturate(1.3);
                box-shadow: 0 0 42px -2px var(--neon-color),
                            inset 0 0 25px var(--neon-color),
                            0 0 82px -8px var(--neon-color);
            }
        }
        .animate-breathing { 
            animation: breathing var(--b-dur, 5s) cubic-bezier(0.45, 0, 0.55, 1) infinite; 
            will-change: transform, filter, box-shadow;
        }

        @keyframes pulse-green-vibrate-resonance {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); transform: scale(1); }
            10% { transform: scale(1.15) translate3d(-3px, 3px, 0); }
            20% { transform: scale(1.2) translate3d(3px, -3px, 0); }
            50% { box-shadow: 0 0 120px 50px rgba(0, 255, 136, 0.9); transform: scale(1.3); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); transform: scale(1); }
        }
        .pulse-correct { animation: pulse-green-vibrate-resonance 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards !important; }

        .text-halo {
            text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px var(--neon-color);
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.6; border-width: 4px; }
            100% { transform: scale(1.6); opacity: 0; border-width: 1px; }
        }
        .hover-ripple {
            position: absolute;
            inset: -15px;
            border: 3px solid var(--neon-color);
            border-radius: 50%;
            animation: ripple 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
            pointer-events: none;
            display: none;
            will-change: transform, opacity;
        }
        .bubble-container:hover .hover-ripple { display: block; }

        /* DIA8 VISUAL SYSTEM: coin bubble 2.5D, round breathing bubbles. */
        .bubble-visual-dia8 .neon-ring {
            box-shadow: 0 12px 28px rgba(0,0,0,.46),
                        0 0 calc(20px * var(--dia8-glow, 1)) -4px var(--neon-color),
                        0 0 calc(58px * var(--dia8-glow, 1)) -14px var(--neon-color),
                        inset 0 0 12px rgba(255,255,255,.18);
            border: 2px solid color-mix(in srgb, var(--neon-color) 56%, white 44%);
            border-radius: 50%;
        }
        .bubble-visual-dia8 .bubble-neon-halo { display:none; }
        .bubble-visual-dia8 .bubble-inner {
            background:
                radial-gradient(circle at 30% 20%, rgba(255,255,255,.86) 0 8%, rgba(255,255,255,.24) 9%, transparent 23%),
                radial-gradient(circle at 62% 70%, rgba(0,0,0,.58) 0%, transparent 42%),
                conic-gradient(from 142deg,
                    rgba(255,255,255,.58),
                    color-mix(in srgb, var(--neon-color) 40%, #ffffff 22%),
                    rgba(255,255,255,.08),
                    color-mix(in srgb, var(--neon-color) 76%, #05070a 24%),
                    rgba(255,255,255,.5)),
                radial-gradient(circle at 50% 43%,
                    color-mix(in srgb, var(--core-color) 82%, white 18%) 0%,
                    var(--core-color) 38%,
                    rgba(0,0,0,.92) 100%);
            border: 3px solid color-mix(in srgb, var(--neon-color) 48%, #ffffff 52%);
            box-shadow: inset 0 4px 12px rgba(255,255,255,.22),
                        inset 0 -16px 28px rgba(0,0,0,.62),
                        inset 0 0 38px color-mix(in srgb, var(--neon-color) 36%, transparent),
                        0 8px 20px rgba(0,0,0,.42);
            overflow: hidden;
        }
        .bubble-visual-dia8 .bubble-inner::before {
            display: block;
            content: '';
            position: absolute;
            inset: 8%;
            width: auto;
            height: auto;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 24%, rgba(255,255,255,.32), transparent 22%),
                radial-gradient(circle at 50% 58%, rgba(255,255,255,.07), transparent 55%);
            border: 1px solid rgba(255,255,255,.24);
            box-shadow: inset 0 0 18px rgba(255,255,255,.08),
                        inset 0 0 28px color-mix(in srgb, var(--neon-color) 28%, transparent);
            filter: none;
            transform: none;
            pointer-events: none;
            z-index: 3;
        }
        .bubble-visual-dia8 .bubble-inner::after {
            content: '';
            position: absolute;
            top: -42%;
            left: -70%;
            width: 52%;
            height: 185%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.62), transparent);
            opacity: .44;
            transform: rotate(28deg) translateX(-60%);
            animation: coin-bubble-shine 6.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 6;
            will-change: transform, opacity;
        }
        @keyframes coin-bubble-shine {
            0%, 18% { transform: rotate(28deg) translateX(-75%); opacity: 0; }
            38% { opacity: .52; }
            62%, 100% { transform: rotate(28deg) translateX(310%); opacity: 0; }
        }
        @keyframes breathing-dia8 {
            0%,100% { transform: scale(1) rotate(-0.35deg); }
            50% { transform: scale(var(--breath-scale,1.025)) rotate(0.35deg); }
        }
        .bubble-visual-dia8 .animate-breathing {
            animation: breathing-dia8 3s ease-in-out infinite;
            will-change: transform;
        }
        .bubble-visual-dia8:hover .neon-ring {
            box-shadow: 0 16px 34px rgba(0,0,0,.52),
                        0 0 calc(32px * var(--dia8-glow, 1)) -2px var(--neon-color),
                        0 0 calc(88px * var(--dia8-glow, 1)) -10px var(--neon-color),
                        inset 0 0 20px rgba(255,255,255,.24);
            transform: scale(1.035);
        }
        .bubble-visual-dia8 .bubble-shimmer { display:none!important; }
        .bubble-visual-dia8 .hover-ripple {
            display: block;
            inset: -9px;
            opacity: .22;
            border-width: 1px;
        }
        .bubble-container .material-symbols-outlined {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.46em;
            height: 1.46em;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.26), rgba(255,255,255,.08) 45%, rgba(0,0,0,.28) 100%);
            border: 1px solid rgba(255,255,255,.22);
            box-shadow: inset 0 0 10px rgba(255,255,255,.08), 0 0 14px color-mix(in srgb, var(--neon-color) 42%, transparent);
            margin-bottom: .12em;
            color: rgba(255,255,255,.92);
            opacity: .82 !important;
        }
        .bubble-container:hover .material-symbols-outlined {
            opacity: 1 !important;
            color: #fff;
            box-shadow: inset 0 0 12px rgba(255,255,255,.15), 0 0 20px color-mix(in srgb, var(--neon-color) 62%, transparent);
        }
        .bubble-visual-dia8 .bubble-topic-label {
            text-shadow: 0 2px 8px rgba(0,0,0,.95), 0 0 12px color-mix(in srgb, var(--neon-color) 55%, transparent);
        }
        .bubble-theme-d8-dark .topic-bubble-icon,
        .bubble-theme-d8-dark .text-halo { filter:drop-shadow(0 0 5px rgba(255,255,255,.35)); }

        .fill-1 { font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48; }

        /* PRESTIGE STAR EFFECTS */
        @keyframes metallic-glint {
            0% { transform: translate(-150%, -150%) rotate(45deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translate(150%, 150%) rotate(45deg); opacity: 0; }
        }

        .prestige-star {
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #f59e0b 30%, #ffcc00 50%, #f59e0b 70%, #785a28 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6));
            will-change: transform, opacity, filter;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .prestige-star::after {
            content: 'star';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
            -webkit-background-clip: text;
            animation: metallic-glint 3s infinite linear;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes star-vinh-quang-aura {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 25px rgba(245, 158, 11, 1)); transform: scale(1.05); }
        }
        .star-crown-aura {
            animation: star-vinh-quang-aura 2s infinite ease-in-out;
            will-change: filter, transform;
        }

        /* AI GENERATING FOCUS MODE */
        @keyframes generating-focus-pulse {
            0%, 100% { 
                box-shadow: 0 0 100px 20px #ffffff, inset 0 0 40px #ffffff; 
                filter: brightness(1.5) contrast(1.2); 
                transform: scale(2.0);
            }
            50% { 
                box-shadow: 0 0 150px 40px #ffffff, inset 0 0 60px #ffffff; 
                filter: brightness(2) contrast(1.5);
                transform: scale(2.1) translate(2px, -2px);
            }
        }
        .animate-generating-focus {
            animation: generating-focus-pulse 0.4s ease-in-out infinite;
            z-index: 1000 !important;
            pointer-events: none;
        }
    
        /* VISUAL RESTORATION 1.6 */
        .ai-mascot-speech { background: transparent !important; border: 0 !important; box-shadow: none !important; backdrop-filter: none !important; }
        .dia8-canvas-settings-button {
            background: rgba(8,18,38,.78);
            border: 1px solid rgba(125,211,252,.38);
            color: #d8f4ff;
            box-shadow: 0 0 10px rgba(56,189,248,.18), 0 8px 26px rgba(0,0,0,.42);
            backdrop-filter: blur(12px);
        }
        .dia8-canvas-settings-button:hover {
            border-color: rgba(125,211,252,.62);
            box-shadow: 0 0 16px rgba(56,189,248,.28), 0 10px 30px rgba(0,0,0,.5);
        }
</style>

    <link rel="stylesheet" href="./mobile.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
    <script src="./mobile-runtime.js"></script>
</body>

</html>
